<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void OS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 64 64" width="72" height="72">
        <circle cx="32" cy="32" r="22" fill="url(#bootg)"/>
        <circle cx="32" cy="32" r="9" fill="#0b0b12"/>
        <circle cx="32" cy="32" r="3.5" fill="#c4b5fd"/>
        <defs>
          <radialGradient id="bootg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="55%" stop-color="#6d28d9"/>
            <stop offset="100%" stop-color="#0f0a1a"/>
          </radialGradient>
        </defs>
      </svg>
      <div class="boot-title">Void OS</div>
      <div class="boot-bar"><div class="boot-progress"></div></div>
    </div>
  </div>

  <main id="auth-screen" class="hidden">
    <section class="auth-panel">
      <div class="auth-mark">◉</div><div class="auth-eyebrow">VOID OPERATING SYSTEM</div>
      <h1 id="auth-title">Welcome back.</h1><p id="auth-description">Sign in to continue to your desktop.</p>
      <div class="auth-tabs"><button type="button" class="active" id="auth-signin-tab">Sign in</button><button type="button" id="auth-signup-tab">Create account</button></div>
      <form id="auth-form">
        <label class="auth-field" id="auth-name-wrap" hidden><span>Display name</span><input id="auth-name" type="text" autocomplete="name" maxlength="32" placeholder="What should we call you?"></label>
        <label class="auth-field"><span>Email</span><input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label class="auth-field"><span>Password</span><input id="auth-password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="6"></label>
        <div class="auth-message" id="auth-message" role="status" aria-live="polite"></div>
        <button class="auth-submit" id="auth-submit" type="submit">Sign in</button>
      </form>
      <button type="button" class="auth-guest" id="auth-guest" style="margin-top:12px;width:100%;padding:12px;border:1px solid #2a2a38;border-radius:10px;background:transparent;color:#c4b5fd;font-weight:600;cursor:pointer">Continue as Guest</button>
      <div class="auth-connection" id="auth-connection"><span></span> Checking sign-in service…</div>
      <p class="auth-footnote">Your account keeps your Void OS experience ready whenever you return.</p>
    </section>
  </main>
  <div id="desktop" class="hidden">
    <div id="desktop-icons"></div>
    <div id="windows-container"></div>
    <div id="start-menu" class="hidden">
      <div class="start-header"><div class="start-user"><div class="avatar">V</div><div><div class="start-name">Void User</div><div class="start-sub">Void OS</div></div></div></div>
      <div class="start-apps" id="start-apps"></div>
      <div class="start-footer"><button id="power-btn" title="Reset session">⏻</button></div>
    </div>
    <div id="taskbar">
      <button id="start-btn" title="Start"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg></button>
      <div id="taskbar-apps"></div><div id="taskbar-right"><div id="clock"></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="runtime-config.js?v=2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
